name: Publicar Sistema Avalia no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v6
      - name: Preparar Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Compilar frontend
        env:
          VITE_BASE_PATH: /Gest-o-de-Avalia-es/
          VITE_SUPABASE_URL: https://ooeyawutdqamszbjyhoi.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_8Daz36fu0hUSBvjiLw-FEg_WfWt70ie
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: pnpm --filter @omr/web build
      - name: Desativar processamento Jekyll
        run: touch apps/web/dist/.nojekyll
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Enviar site compilado
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
